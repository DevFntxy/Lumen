<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN · Aplicación móvil</title>
<style>
:root{--bg:#090e12;--panel:#111a1f;--panel2:#172329;--line:#294047;--text:#edf5ed;--muted:#8ca2a0;--mint:#8cf0c2;--cyan:#65d8dc;--amber:#f2bd68;--red:#ef7771}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#183039 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}header{max-width:1200px;margin:auto;padding:30px 28px 22px;display:flex;align-items:center;gap:16px}header img{width:48px;height:48px;object-fit:contain}header h1{font-size:20px;letter-spacing:.12em;margin:0}header p{margin:2px 0;color:var(--muted);font-size:13px}.layout{max-width:1200px;margin:auto;padding:0 28px 50px;display:grid;grid-template-columns:310px 1fr;gap:36px;align-items:start}.side{position:sticky;top:20px}.eyebrow{color:var(--mint);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.side h2{font-size:28px;line-height:1.1;margin:10px 0}.side>p{color:var(--muted);font-size:14px}.nav{display:grid;gap:6px;margin:25px 0}.nav button{border:1px solid transparent;background:none;color:#a9bab8;text-align:left;padding:11px 13px;border-radius:9px;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{color:var(--mint);background:#142126;border-color:#294047}.palette{display:flex;gap:8px;margin-top:18px}.swatch{width:22px;height:22px;border-radius:7px;border:1px solid #ffffff26}.pal-label{font-size:11px;color:var(--muted);margin-top:7px}.stage{display:flex;justify-content:center}.device{width:375px;min-height:790px;border:1px solid #40545a;border-radius:34px;background:#0d1418;box-shadow:0 24px 90px #0009;overflow:hidden;padding:10px;position:relative}.screen{background:linear-gradient(160deg,#111b20,#0d1418 60%);border-radius:25px;min-height:768px;padding:16px 16px 90px;position:relative;overflow:hidden}.status{font-size:11px;color:#9cafac;display:flex;justify-content:space-between;padding:0 3px 14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;color:var(--mint)}.brand img{width:24px;height:24px;object-fit:contain}.icon{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px;color:var(--mint)}h3{margin:0;font-size:23px;line-height:1.15} .sub{color:var(--muted);font-size:12px;margin:5px 0 18px}.card{background:linear-gradient(145deg,#17252a,#11191e);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.label{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.value{font-size:22px;font-weight:700}.small{font-size:12px;color:var(--muted)}.mint{color:var(--mint)}.cyan{color:var(--cyan)}.amber{color:var(--amber)}.bar{height:7px;background:#28383d;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#54cba8,#91f2c7);border-radius:9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#131e23;border:1px solid var(--line);border-radius:12px;padding:12px}.stat .value{font-size:21px;margin-top:3px}.cover{height:115px;border-radius:13px;overflow:hidden;position:relative;margin:13px 0;background:#1c3438}.cover img{width:100%;height:100%;object-fit:cover;opacity:.68}.cover span{position:absolute;bottom:12px;left:13px;font-size:15px;font-weight:700}.tabs{position:absolute;bottom:0;left:0;right:0;background:#10191e;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 2px 16px}.tabs button{min-width:58px;padding:3px 4px;background:none;border:0;color:#849996;font-size:9px;display:grid;gap:3px;justify-items:center;cursor:pointer}.tabs button b{font-size:17px;font-weight:400}.tabs button.sel{color:var(--mint)}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px;background:#131e23;border:1px solid var(--line);border-radius:12px;padding:10px}.thumb{width:40px;height:40px;border-radius:9px;background:#24383b;object-fit:cover}.item strong{font-size:12px;display:block}.item small{color:var(--muted);font-size:10px}.tag{font-size:10px;color:var(--mint);margin-left:auto}.chart{height:120px;display:flex;align-items:end;gap:10px;padding:12px 4px 0}.chart i{flex:1;background:linear-gradient(#80efc3,#367f70);border-radius:6px 6px 2px 2px;position:relative}.chart i:after{content:attr(data-day);position:absolute;top:calc(100% + 5px);font-size:9px;color:var(--muted);left:50%;transform:translateX(-50%)}.rank{display:grid;grid-template-columns:30px 1fr auto;align-items:center;padding:10px 0;border-bottom:1px solid #26363a;font-size:12px}.rank:last-child{border:0}.medal{color:var(--amber);font-weight:bold}.week{display:flex;justify-content:space-between;margin-top:13px}.day{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted)}.day.done{background:#1b3b35;color:var(--mint);border-color:#4c987e}.source{font-size:10px;color:#66807d;text-align:center;margin-top:14px}
@media(max-width:760px){header{padding:20px}.layout{display:block;padding:0 12px 30px}.side{position:static}.side h2{font-size:24px}.nav{display:flex;overflow-x:auto;white-space:nowrap;margin:16px 0}.nav button{flex:none;padding:9px}.palette,.pal-label{display:none}.stage{overflow:visible}.device{width:min(375px,100%);min-height:780px}.screen{min-height:758px}}
header{padding-top:36px;padding-bottom:28px}header img{filter:drop-shadow(0 0 12px #8cf0c255)}header h1{font-size:18px;letter-spacing:.2em}header p{letter-spacing:.025em}.side h2{font-size:34px;letter-spacing:-.04em}.side>p{line-height:1.75}.device{border-color:#34484d;background:#080d10;box-shadow:0 30px 100px #000b,0 0 0 5px #ffffff04}.screen{background:radial-gradient(ellipse at 85% 0,#18302d66,transparent 36%),linear-gradient(160deg,#111b20,#0c1317 65%)}.card,.stat,.item{box-shadow:0 8px 22px #0002}.cover img{filter:saturate(.78) contrast(1.06)}.tabs{backdrop-filter:blur(16px)}.tabs button{transition:color .2s,transform .2s}.tabs button:hover{color:var(--mint);transform:translateY(-2px)}.nav button{transition:all .2s}.nav button.active{box-shadow:inset 2px 0 var(--mint)}.swatch{box-shadow:0 2px 8px #0005}::selection{background:#8cf0c244} @media(min-width:1100px){.layout{grid-template-columns:340px 1fr;gap:70px}.side{padding-top:22px}}

/* Interacciones del prototipo */
.device{transition:transform .35s,box-shadow .35s}.screen{scroll-behavior:smooth}.screen.changing{animation:screenIn .3s ease}@keyframes screenIn{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:none}}.item,.cover{cursor:pointer;transition:border-color .2s,transform .2s}.item:hover,.cover:hover{border-color:#67b99d;transform:translateY(-2px)}.tap{cursor:pointer;transition:border-color .2s,transform .2s,background .2s}.tap:hover{border-color:#67b99d;transform:translateY(-2px)}.tap:active{transform:scale(.985)}.action{font:inherit;color:var(--mint);background:#18342e;border:1px solid #3c7664;border-radius:9px;padding:9px 12px;cursor:pointer}.action:hover{background:#20483d}.modal-shade{position:absolute;inset:0;z-index:10;background:#030708cf;backdrop-filter:blur(8px);display:flex;align-items:flex-end;padding:12px;animation:fade .18s ease}.sheet{width:100%;border:1px solid #39545a;border-radius:22px 22px 16px 16px;padding:19px;background:linear-gradient(145deg,#1a292e,#0e171b);box-shadow:0 -14px 44px #0008;animation:rise .25s ease}.grab{width:38px;height:4px;border-radius:4px;background:#53666a;margin:-8px auto 17px}.sheet h3{font-size:21px}.sheet p{color:#a3b6b2;font-size:13px;line-height:1.65}.sheet .row{margin-top:14px}.close{border:0;color:var(--muted);background:none;font-size:22px;cursor:pointer}.toast{position:absolute;z-index:12;left:50%;bottom:82px;transform:translate(-50%,12px);opacity:0;background:#e3f5e9;color:#10221c;border-radius:20px;padding:9px 15px;font-size:12px;font-weight:650;white-space:nowrap;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.screen{overflow-y:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.tabs{position:fixed;position:absolute}.top .icon{cursor:pointer}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
</style></head><body><header><img src="dimatrek-logo.png" alt="DIMATREK"><div><h1>LUMEN</h1><p>Aplicación móvil · Crónicas de una Ciudad Olvidada</p></div></header><main class="layout"><aside class="side"><div class="eyebrow">LUMEN · EXPERIENCIA MÓVIL</div><h2>Lumen, contigo.<br>En cada misión.</h2><p>Consulta tu progreso, revisa tus descubrimientos y vuelve a la historia cuando quieras.</p><nav class="nav" id="nav"></nav><div class="eyebrow">Paleta tomada de la identidad visual</div><div class="palette"><i class="swatch" style="background:#090e12"></i><i class="swatch" style="background:#172329"></i><i class="swatch" style="background:#8cf0c2"></i><i class="swatch" style="background:#65d8dc"></i><i class="swatch" style="background:#f2bd68"></i></div><div class="pal-label">Grafito · acero · energía · señal · alerta</div></aside><section class="stage"><div class="device"><div class="screen" id="screen"></div></div></section></main>
<script>
const img=(n)=>n+'.png';const screens={
'Inicio':`<h3>Buenas noches, Alex</h3><p class="sub">La ciudad aún guarda secretos.</p><div class="card"><div class="row"><div><div class="label">Partida activa</div><b>Distrito industrial</b></div><span class="tag">● SINCRONIZADO</span></div><div class="cover"><img src="${img('home_screen')}"><span>Continúa explorando Lumen</span></div><div class="row small"><span>Progreso de la historia</span><b class="mint">68%</b></div><div class="bar"><i style="width:68%"></i></div></div><div class="stats"><div class="stat"><div class="label">Nivel M-4</div><div class="value">12 <small class="mint">↑ 240 XP</small></div></div><div class="stat"><div class="label">Horas jugadas</div><div class="value">18.5 <small>h</small></div></div></div><div class="card" style="margin-top:10px"><div class="row"><b>Objetivo actual</b><span class="amber">›</span></div><p class="small">Restablece el núcleo de energía · Sector 03</p><div class="bar"><i style="width:45%"></i></div></div><div class="label" style="margin:17px 0 8px">Actividad reciente</div><div class="item"><span class="icon">⌁</span><div><strong>Fragmento de memoria encontrado</strong><small>Hace 12 min · Planta de ensamblaje</small></div></div>`,
'Estadísticas':`<h3>Tu progreso</h3><p class="sub">Resumen de actividad de M-4</p><div class="stats"><div class="stat"><div class="label">Nivel</div><div class="value">12</div><small class="mint">Explorador</small></div><div class="stat"><div class="label">Experiencia</div><div class="value">2,480</div><small>de 3,000 XP</small></div><div class="stat"><div class="label">Enemigos</div><div class="value">38</div><small>unidades neutralizadas</small></div><div class="stat"><div class="label">Exploración</div><div class="value">68%</div><small>de la ciudad</small></div></div><div class="card" style="margin-top:11px"><div class="row"><b>Tiempo de juego</b><span class="mint">18 h 32 m</span></div><div class="chart"><i style="height:45%" data-day="L"></i><i style="height:72%" data-day="M"></i><i style="height:35%" data-day="X"></i><i style="height:88%" data-day="J"></i><i style="height:58%" data-day="V"></i><i style="height:96%" data-day="S"></i><i style="height:67%" data-day="D"></i></div><div style="height:20px"></div></div><div class="card"><div class="row"><b>Racha de exploración</b><span class="amber">🔥 4 días</span></div><div class="week"><i class="day done">L</i><i class="day done">M</i><i class="day done">X</i><i class="day done">J</i><i class="day">V</i><i class="day">S</i><i class="day">D</i></div></div><div class="item"><img class="thumb" src="${img('progress_user_screen')}"><div><strong>Avance de campaña</strong><small>11 de 16 objetivos completados</small></div><span class="tag">68%</span></div>`,
'Misiones':`<h3>Registro de misiones</h3><p class="sub">Tu rastro a través de la ciudad</p><div class="row" style="margin-bottom:12px"><span class="tag">ACTIVAS 02</span><span class="small">COMPLETADAS 11</span></div><div class="item"><img class="thumb" src="${img('quest_log_screen')}"><div><strong>El pulso de la ciudad</strong><small>Restablecer núcleo · Sector 03</small><div class="bar"><i style="width:45%"></i></div></div><span class="tag">45%</span></div><div class="item"><span class="icon">⌖</span><div><strong>Señal entre las ruinas</strong><small>Investiga la transmisión</small></div><span class="tag">NUEVA</span></div><div class="label" style="margin:22px 0 9px">Completadas recientemente</div><div class="item"><span class="icon">✓</span><div><strong>Una chispa en la oscuridad</strong><small>Hace 2 horas · +300 XP</small></div></div><div class="item"><span class="icon">✓</span><div><strong>Reparación de emergencia</strong><small>Ayer · +150 XP</small></div></div>`,
'Codex':`<h3>Codex de Lumen</h3><p class="sub">Lo que descubres, permanece.</p><div class="item"><img class="thumb" src="${img('character_codex_screen')}"><div><strong>Personajes</strong><small>4 registros descubiertos</small></div><span class="tag">4/9 ›</span></div><div class="item"><img class="thumb" src="${img('enemy_and_boss_codex_screen')}"><div><strong>Unidades hostiles</strong><small>6 entradas registradas</small></div><span class="tag">6/12 ›</span></div><div class="item"><img class="thumb" src="${img('memory_fragments_screen')}"><div><strong>Fragmentos de memoria</strong><small>Reconstruye el pasado</small></div><span class="tag">8/20 ›</span></div><div class="item"><img class="thumb" src="${img('inventory_screen')}"><div><strong>Inventario</strong><small>Objetos y componentes</small></div><span class="tag">›</span></div><div class="card" style="margin-top:15px"><div class="label">Descubrimiento reciente</div><b>Registro de mantenimiento #08</b><p class="small">“La señal vuelve cada noche. Alguien sigue ahí abajo.”</p></div>`,
'Explorar':`<h3>Mapa de zonas</h3><p class="sub">Distrito industrial · Sector 03</p><div class="cover" style="height:210px"><img src="${img('zone_progress_map_screen')}"><span>PLANTA DE ENSAMBLAJE</span></div><div class="stats"><div class="stat"><div class="label">Zona explorada</div><div class="value">72%</div></div><div class="stat"><div class="label">Puntos de interés</div><div class="value">9 <small>/ 14</small></div></div></div><div class="label" style="margin:17px 0 8px">Descubrimientos cercanos</div><div class="item"><span class="icon mint">⌖</span><div><strong>Terminal de archivos</strong><small>Registro narrativo · Encontrado</small></div><span class="tag">✓</span></div><div class="item"><span class="icon amber">◇</span><div><strong>Acceso bloqueado</strong><small>Requiere energía · Sin explorar</small></div><span class="tag">›</span></div>`};
const nav=document.querySelector('#nav'),screen=document.querySelector('#screen');function draw(k){const was=screen.dataset.page;screen.dataset.page=k;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===k));screen.classList.remove("changing");void screen.offsetWidth;screen.classList.add("changing");screen.innerHTML=`<div class="status"><span>9:41</span><span>◈ ◉ ▰</span></div><div class="top"><div class="brand"><img src="dimatrek-logo.png"> LUMEN · APP</div><button class="icon">◉</button></div>${screens[k]}<div class="tabs">${[['Inicio','⌂'],['Misiones','☷'],['Explorar','⌖'],['Codex','▤'],['Estadísticas','▥']].map(([n,i])=>`<button class="${k===n?'sel':''}" ><b>${i}</b>${n}</button>`).join('')}</div>`};Object.keys(screens).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>draw(k);nav.append(b)});draw('Inicio');
</script><script>
const detailData={
'El pulso de la ciudad':['Misión principal','El núcleo energético lleva años desconectado. Encuentra la cámara central y restaura el suministro.','45% completado · Recompensa: 500 XP'],
'Señal entre las ruinas':['Misión secundaria','Una transmisión se repite desde una zona fuera del mapa. Sigue la frecuencia para descubrir quién la envía.','Nueva misión · Recompensa: registro de memoria'],
'Personajes':['Archivo de personajes','Consulta historias y relaciones de quienes aún habitan las ruinas. Completa cada entrada al encontrarlos.','4 de 9 registros descubiertos'],
'Unidades hostiles':['Archivo de amenazas','Identifica patrones y niveles de riesgo recopilados durante tus encuentros.','6 de 12 entradas descubiertas'],
'Fragmentos de memoria':['Memorias recuperadas','Cada fragmento reconstruye una escena de la vida anterior de Lumen.','8 de 20 fragmentos'],
'Inventario':['Inventario de M-4','Componentes, objetos clave y recursos recogidos durante la exploración.','12 objetos · sincronizado'],
'Terminal de archivos':['Punto de interés','Registro narrativo encontrado en la Planta de ensamblaje.','Descubierto'],
'Acceso bloqueado':['Acceso sellado','Restablece la energía del sector para poder explorar esta zona.','Objetivo: El pulso de la ciudad']};
function notify(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.querySelector('#screen').append(t)}t.textContent=msg;t.classList.add('show');clearTimeout(window.notifyTimer);window.notifyTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function detail(title,info){const root=document.querySelector('#screen'),shade=document.createElement('div');shade.className='modal-shade';shade.innerHTML=`<section class="sheet"><div class="grab"></div><div class="row"><div class="label">ARCHIVO DE LUMEN</div><button class="close">×</button></div><h3>${title}</h3><p>${info[1]}</p><div class="card"><div class="label">ESTADO</div><b class="mint">${info[2]}</b></div><div class="row"><button class="action">Añadir al recorrido　↗</button><button class="close">Listo</button></div></section>`;root.append(shade);shade.onclick=e=>{if(e.target===shade||e.target.closest('.close'))shade.remove();if(e.target.closest('.action')){shade.remove();notify('Añadido a tu recorrido')}}}
document.querySelector('#screen').addEventListener('click',e=>{const tab=e.target.closest('.tabs button');if(tab){const name=[...tab.parentElement.children].indexOf(tab);const page=['Inicio','Misiones','Explorar','Codex','Estadísticas'][name];if(screens[page])draw(page);return}if(e.target.closest('.top .icon')){detail('Centro de señales',['Conexión','Tu partida está al día. Hay novedades disponibles en tus misiones y archivos.','Conexión estable · sincronizado ahora']);return}const target=e.target.closest('.item,.cover');if(!target)return;const txt=target.innerText||'';const pair=Object.entries(detailData).find(([k])=>txt.includes(k));if(pair){detail(pair[0],pair[1]);return}if(target.classList.contains('cover'))detail('Distrito industrial',['Mapa de zona','Explora sectores, localiza puntos de interés y vuelve a los lugares donde quedan señales por descubrir.','9 de 14 puntos localizados']);else notify('Progreso actualizado desde tu partida')});
</script></body></html>
